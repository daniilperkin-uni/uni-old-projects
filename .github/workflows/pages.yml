name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # keep in-progress production deployments running (per the Pages starter workflow)
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild index.html and fail if the committed copy is stale
        run: |
          node build.mjs
          git diff --exit-code -- index.html
      - name: Run the section tests
        run: |
          node sections/oop_student_organizer/tools/validate-simulator.mjs
          node --test tests/*.test.mjs
      - name: Stage the site (index + assets + sections, as served locally)
        run: |
          mkdir _site
          cp -r index.html assets sections _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
